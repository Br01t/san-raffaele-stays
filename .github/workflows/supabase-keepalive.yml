name: Supabase keep-alive

# Il piano free di Supabase mette in pausa il progetto dopo ~7 giorni senza attività
# e il sito/area admin smetterebbe di funzionare. Una lettura ogni 3 giorni lo evita.
# Servono le variabili VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY anche in GitHub
# (Settings > Secrets and variables > Actions > Variables), oltre che su Netlify.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY non impostate: niente da fare."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/apartments?select=id&limit=1")
          echo "Risposta HTTP: $code"
          test "$code" = "200"
